; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
build_cache_dir = .cache

[env]
monitor_speed = 115200
monitor_echo = yes
monitor_filters = colorize

; 編譯開始時把 WifiDongleConfig.h 的 SSID/密碼等設定印到 build log,
; 不必開序列埠監視器就能確認(見 print_wifi_config.py)。
extra_scripts = pre:print_wifi_config.py

framework = arduino

build_flags = -std=gnu++2a

build_unflags = -std=gnu++11 -std=gnu++17

[env:slime_dongle_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = slime-dongle-s3
board_build.variants_dir = variants
build_flags =
  -std=gnu++2a
  ;-DARDUINO_USB_CDC_ON_BOOT=1
  ;-DARDUINO_USB_MSC_ON_BOOT=0

; Seeed XIAO ESP32S3 用。ビルド時にこの env を選ぶだけで切り替わります。
;   例: pio run -e slime_dongle_xiao_s3 -t upload
[env:slime_dongle_xiao_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = slime-dongle-xiao-s3
board_build.variants_dir = variants
build_flags =
  -std=gnu++2a
  ;-DARDUINO_USB_CDC_ON_BOOT=1
  ;-DARDUINO_USB_MSC_ON_BOOT=0

;[env:slime_dongle_s2]
;platform = espressif32 @ ^6.9.0
;platform_packages =
